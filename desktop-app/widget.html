<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self';" />
    <title>CourseScribe 錄影工具</title>
    <link rel="stylesheet" href="widget.css" />
  </head>
  <body>
    <section class="widget-shell">
      <header><span class="drag-region">⠿ 拖曳移動</span><button data-close aria-label="關閉小工具">×</button></header>
      <div class="record-row">
        <span class="record-dot" data-dot></span>
        <div class="time-copy"><small data-state>錄影中</small><strong data-time>00:00:00</strong><span data-title>未命名課程</span></div>
      </div>
      <footer><button data-open>開啟主程式</button><button data-pause>暫停</button><button class="stop" data-stop>停止</button></footer>
    </section>
    <script src="widget.js"></script>
  </body>
</html>
